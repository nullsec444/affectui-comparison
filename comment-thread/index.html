<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comment Thread</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#18181b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.head{padding:20px 24px 16px;border-bottom:1px solid #eee}h1{font-size:22px;font-weight:600;letter-spacing:-.5px;margin:0 0 14px}.tabs{display:flex;gap:8px;align-items:center}button{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid #dedee2;background:#fff;color:#62626b;cursor:pointer}button[aria-pressed=true]{background:#18181b;border-color:#18181b;color:#fff}.back{margin-left:auto;text-decoration:none;color:#777;font-size:12px}.demo{padding:24px;max-width:1500px;margin:auto}iframe{display:block;width:100%;height:800px;border:0;background:#fff}details{margin:12px 24px 28px;color:#777}summary{cursor:pointer}pre{white-space:pre;overflow:auto;background:#111;color:#eee;padding:18px;border-radius:8px;max-height:65vh;font:12px/1.5 monospace}.sourcebar{display:flex;gap:12px;margin:12px 0}.sourcebar a{color:inherit}@media(max-width:600px){.head{padding:18px 16px 14px}h1{font-size:21px}.demo{padding:20px 12px}iframe{height:calc(100dvh - 180px);min-height:520px}.back{font-size:11px}details{margin:12px}}
</style></head><body><header class="head"><h1>Comment Thread</h1><div class="tabs"><button id="original" aria-pressed="true">Original demo</button><button id="reconstructed" aria-pressed="false">Inspect replay</button><a class="back" href="../index.html">All components</a></div></header><main class="demo"><iframe id="preview" title="Component preview" src="original-frame.html"></iframe></main><details><summary>Reconstructed TSX source</summary><div class="sourcebar"><button id="copy">Copy source</button><a href="source.tsx.txt">Download source</a></div><pre id="source">Loading…</pre></details><script>
for(const mode of ['original','reconstructed'])document.getElementById(mode).onclick=()=>{document.getElementById('preview').src=mode+'-frame.html';for(const x of ['original','reconstructed'])document.getElementById(x).setAttribute('aria-pressed',String(x===mode));history.replaceState(null,'','#'+(mode==='original'?'original':'inspect'));};
if(location.hash==='#inspect')document.getElementById('reconstructed').click();
fetch('source.tsx.txt').then(r=>r.text()).then(t=>{document.getElementById('source').textContent=t;document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(t);});
</script></body></html>
